<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - Inscription</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #3948ff;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3948ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2a36e8;
        }
        .code-display {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Roblox</h1>
        <p style="text-align:center; margin-bottom:20px;">Pour continuer, entre ton numéro de téléphone.</p>

        <div class="form-group">
            <input type="tel" id="phoneNumber" placeholder="+336XX">
        </div>

        <button onclick="sendCode()">Envoyer le code</button>

        <div id="codeDisplay" class="code-display">
            <p id="codeText"></p>
            <input type="text" id="verificationCode" placeholder="Code à 6 chiffres" style="width:100%; padding:12px; margin-top:10px;">
            <button onclick="verifyCode()">Vérifier</button>
        </div>
    </div>

    <script>
        function sendCode() {
            const phone = document.getElementById('phoneNumber').value;
            if (!phone) {
                alert("Entre ton numéro !");
                return;
            }
            const codeDisplay = document.getElementById('codeDisplay');
            const codeText = document.getElementById('codeText');
            codeText.innerHTML = `<strong>Code envoyé :</strong> <span style="color:#3948ff;">123456</span> (remplace par le vrai code)`;
            codeDisplay.style.display = 'block';
        }

        function verifyCode() {
            const code = document.getElementById('verificationCode').value;
            if (code === '123456') {
                alert("✅ Code valide !");
                window.location.href = "https://www.roblox.com";
            } else {
                alert("Code incorrect, réessaye !");
            }
        }
    </script>
</body>
</html>
